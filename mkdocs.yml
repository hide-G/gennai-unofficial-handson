site_name: ガバメントAI「源内」非公式デプロイハンズオン資料
site_description: 有志が非公式で作成する、ガバメントAI「源内」デプロイハンズオン資料です。公式資料ではありません。
site_url: https://hide-G.github.io/gennai-unofficial-handson/

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: ライトモードに切り替え

nav:
  - 概要: index.md

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: A4印刷 / PDF保存

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/theme.css
  - stylesheets/print.css
