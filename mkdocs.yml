site_name: ガバメントAI「源内」非公式デプロイハンズオン資料
site_description: 有志が非公式で作成する、ガバメントAI「源内」デプロイハンズオン資料です。公式資料ではありません。
site_url: https://hide-G.github.io/gennai-unofficial-handson/

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: ライトモードに切り替え

nav:
  - "第1章 ガバメントAI「源内」の概要": index.md
  - "第2章 システムアーキテクチャの紹介": architecture.md
  - "第3章 このハンズオンの対象": audience.md
  - "第4章 事前準備（GitHubアカウント、AWSアカウント、必要ツール）": prerequisites.md
  - "第5章 AWSアカウントの注意（コスト、権限、リージョン、切り分け）": aws-notes.md
  - "第6章 源内 Web（AI インターフェース）": web.md
  - "第7章 源内 AI アプリのデプロイ": deploy-ai-api.md
  - "第8章 動作確認": verify.md
  - "第9章 後片付け": cleanup.md
  - "第10章 想定質問集（FAQ）": faq.md
  - "第11章 用語集・参考リンク": glossary.md

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: A4印刷 / PDF保存

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/theme.css
  - stylesheets/print.css
